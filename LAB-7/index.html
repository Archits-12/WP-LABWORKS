<!DOCTYPE html>
<html>
<head>
    <title>Web Programming Lab 7 - Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .calculator { width: 350px; margin: auto; padding: 25px; border: 2px solid black; border-radius: 10px; }
        input, select, button { padding: 10px; margin: 8px; font-size: 16px; }
        #result { font-weight: bold; margin-top: 15px; }
    </style>
    <script>
        function calculate() {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let operation = document.getElementById("operation").value;
            let result;
            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById("result").innerHTML = "Please enter both numbers.";
                return;
            }
            switch (operation) {
                case "add": result = num1 + num2; break;
                case "subtract": result = num1 - num2; break;
                case "multiply": result = num1 * num2; break;
                case "divide":
                    if (num2 === 0) {
                        document.getElementById("result").innerHTML = "Cannot divide by zero.";
                        return;
                    }
                    result = num1 / num2;
                    break;
            }
            document.getElementById("result").innerHTML = "Result: " + result;
        }
    </script>
</head>
<body>
    <div class="calculator">
        <h2>Mathematical Calculator</h2>
        <form onsubmit="event.preventDefault(); calculate();">
            <input type="number" id="num1" placeholder="Enter first number" step="any" required><br>
            <input type="number" id="num2" placeholder="Enter second number" step="any" required><br>
            <select id="operation">
                <option value="add">Addition (+)</option>
                <option value="subtract">Subtraction (-)</option>
                <option value="multiply">Multiplication (×)</option>
                <option value="divide">Division (÷)</option>
            </select><br>
            <button type="submit">Calculate</button>
        </form>
        <p id="result"></p>
    </div>
    <br><br>
    <p><b>Archit Singhania - 24BTTSN001</b></p>
</body>
</html>
